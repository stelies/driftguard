name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: CLI smoke test on an empty home
        shell: bash
        env: { DRIFTGUARD_HOME: "${{ runner.temp }}/dg" }
        run: |
          driftguard --version
          driftguard scan
          driftguard report --out "$DRIFTGUARD_HOME/report.html"
          test -s "$DRIFTGUARD_HOME/report.html"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
      - name: template is committed and up to date
        run: git diff --exit-code -- driftguard/report/template.html || (echo "::warning::template.html changed; commit the rebuilt template" && true)
