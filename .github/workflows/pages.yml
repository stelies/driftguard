name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
      - run: python -m pip install -e .
      - name: synthetic demo (no real user data)
        run: python scripts/make_demo_data.py --out _site/demo/index.html
      - run: cp -r site/* _site/ && touch _site/.nojekyll
      - name: privacy guard
        run: "! grep -rIl -e '/home/' -e 'C:\\\\Users\\\\' _site/ || (echo 'real paths leaked into site' && exit 1)"
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
